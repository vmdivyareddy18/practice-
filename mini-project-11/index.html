<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Project 11: Color Mixer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header>
      <h1>RGB Color Mixer</h1>
      <p>Use the sliders to build a custom RGB color.</p>
    </header>

    <section class="controls">
      <label>
        Red
        <input type="range" id="red" min="0" max="255" value="160" aria-label="Red channel value" />
        <span class="value" id="redValue">160</span>
      </label>
      <label>
        Green
        <input type="range" id="green" min="0" max="255" value="180" aria-label="Green channel value" />
        <span class="value" id="greenValue">180</span>
      </label>
      <label>
        Blue
        <input type="range" id="blue" min="0" max="255" value="200" aria-label="Blue channel value" />
        <span class="value" id="blueValue">200</span>
      </label>
    </section>

    <section class="output">
      <div class="swatch" id="swatch"></div>
      <div class="color-info" id="colorInfo">rgb(160, 180, 200)</div>
      <div class="hex-info" id="hexInfo">#a0b4c8</div>
            <div class="button-row">
        <button id="copyButton" type="button">Copy Color</button>
        <button id="resetButton" type="button">Reset</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
