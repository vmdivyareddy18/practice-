<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project 5 — Tip Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Tip Calculator</h1>
    <form id="form" onsubmit="return false;">
      <label>Bill amount
        <input id="bill" type="number" min="0" step="0.01" placeholder="e.g. 42.50" />
      </label>
      <label>Tip %
        <input id="tip" type="number" min="0" step="0.1" value="15" />
      </label>
      <label>People
        <input id="people" type="number" min="1" step="1" value="1" />
      </label>
      <div class="actions">
        <button id="calc">Calculate</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </form>

    <section id="result" class="result" aria-live="polite">
      <div>Tip amount: <strong id="tipAmount">—</strong></div>
      <div>Total per person: <strong id="perPerson">—</strong></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
